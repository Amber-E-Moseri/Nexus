name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Job 1: Security Audit
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on any moderate+ advisory that is not in .github/audit-baseline.json (inherited debt stays
      # listed in the log; new or escalated findings fail the PR). See scripts/audit-gate.mjs.
      - name: Run security audit (regression gate)
        run: node scripts/audit-gate.mjs

  # Job 2: Build Verification
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not created"
            exit 1
          fi
          echo "✅ Build successful"
          du -sh dist
          find dist -type f | wc -l | xargs echo "Files in dist:"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist
          retention-days: 5

  # Job 3: Test Coverage
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DB-backed suites run against an isolated local Supabase built from THIS commit's migrations.
      # They must never use the repository's remote Supabase secrets: those are production credentials
      # (the same secrets drive deactivate-temp-sprint-members.yml) and the suites write fixtures.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start local Supabase (applies every migration from zero)
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,postgres-meta,supavisor

      - name: Verify migration chain reconstructed
        run: |
          DB=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)
          q() { docker exec "$DB" psql -U postgres -At -c "$1"; }
          for v in 20260929000010 20270930000030 20270930000031; do
            [ "$(q "select count(*) from supabase_migrations.schema_migrations where version = '$v'")" = "1" ] \
              || { echo "::error::migration $v missing from the reconstructed ledger"; exit 1; }
          done
          files=$(ls supabase/migrations/*.sql | xargs -n1 basename | grep -cE '^[0-9]{14}_')
          applied=$(q "select count(*) from supabase_migrations.schema_migrations")
          echo "migration files: $files, applied: $applied"
          [ "$files" = "$applied" ] || { echo "::error::ledger ($applied) does not match migration files ($files)"; exit 1; }

      - name: Run tests
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          export SUPABASE_URL="$API_URL" VITE_SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY" VITE_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run test

      - name: Local Supabase logs (on failure)
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do
            echo "::group::$c"; docker logs --tail 60 "$c" 2>&1 || true; echo "::endgroup::"
          done

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 30

  # Job 4: Lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

  # Final Status Check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    # Repo default token is read-only; this job only needs to post the summary comment on PRs.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs: [ security, build, test ]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.security.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ] || [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          fi
          echo "✅ CI Pipeline passed"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const buildResult = '${{ needs.build.result }}';
            const testResult = '${{ needs.test.result }}';
            const securityResult = '${{ needs.security.result }}';

            const failed = [
              buildResult === 'failure' && 'Build failed',
              testResult === 'failure' && 'Tests failed',
              securityResult === 'failure' && 'Security audit failed',
            ].filter(Boolean);

            const status = failed.length
              ? `❌ Some checks failed\n${failed.map(f => `- ${f}`).join('\n')}`
              : '✅ All checks passed!';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## CI Pipeline Status\n${status}\n\n[View full workflow run →](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
