name: Deactivate Temporary Sprint Members

# Run daily at midnight UTC
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deactivate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run deactivation task
        run: |
          node --input-type=module -e "
            import { createClient } from '@supabase/supabase-js';

            const supabase = createClient(
              process.env.SUPABASE_URL,
              process.env.SUPABASE_SERVICE_ROLE_KEY
            );

            const now = new Date().toISOString();
            const { data, error } = await supabase
              .from('sprint_members')
              .update({ is_active: false })
              .eq('is_active', true)
              .lt('expires_at', now)
              .select('id');

            if (error) {
              console.error('Deactivation failed:', error.message);
              process.exit(1);
            }
            console.log('Deactivated', data?.length ?? 0, 'expired sprint member(s)');
          "
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Log completion
        if: success()
        run: echo "✓ Temporary member deactivation completed successfully"

      - name: Log failure
        if: failure()
        run: echo "✗ Temporary member deactivation failed"
